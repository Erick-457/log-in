<!DOCTYPE html>
<html lang="en">
<head>
    <title>Desque Login Page</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="login-container">
    <h1>Desque Login Page</h1><br>
    <p>Welcome to the Desque Login Page</p>
    <form action="home.html">
        <label for="username">Username:</label><br><br>
        <input type="text" id="username" placeholder="Enter your username" name="username" required><br><br>
        
        <label for="password">Password:</label><br><br>
        <input type="password" id="password" placeholder="Enter your password" name="password" required><br><br>
      
        <button type="submit">Login</button>
    </form>
    <br><br>
    Don't have an account? <a href ="https://e-learning.embuni.ac.ke/login/index.php" target="_blank">Sign up</a>
    </div>
    </body>
</html>
